<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!--
    captantan fork: launcher icon for dev.captantan.freerdp ("RDP"). Source artwork; not built
    into the app. Edit this first, then mirror the change in the drawables.

    Canvas: Android's 108x108 dp adaptive-icon canvas. The launcher shows the centre
    72x72 dp through its mask; everything here sits inside the 66 dp safe-zone circle
    (the ring's outer edge is 26.75 dp from the centre, the limit is 33).

    Layers map 1:1 to the vector drawables in src/main/res/drawable/:
      #background = ic_launcher_background.xml
      #foreground = ic_launcher_foreground.xml (and, in one colour, ic_launcher_monochrome.xml)

    Original artwork drawn for this app. Cobalt #0047AB, white #FFFFFF.
  -->
  <g id="background">
    <rect width="108" height="108" fill="#0047ab"/>
  </g>
  <g id="foreground" fill="none" stroke="#ffffff">
    <circle cx="54" cy="54" r="24" stroke-width="5.5"/>
    <path d="M 46.4 40.88 L 54 48.28 L 46.4 55.68 M 61.6 52.32 L 54 59.72 L 61.6 67.12"
          stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
