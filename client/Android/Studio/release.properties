# captantan fork: build configuration for the fork's releases and its compile check.
# ../build.gradle reads this file as new File('release.properties'), that is relative to the
# directory Gradle is started in, so run ./gradlew from client/Android/Studio.
# CMAKE_ARGUMENTS is upstream's default list from build.gradle with FFmpeg turned off and the
# MediaCodec H.264 decoder turned on (roadmap 1.3; libfreerdp tries it before OpenH264).
ABI_FILTERS=arm64-v8a
SPLIT_ENABLED=false
BUILD_UNIVERSAL=false
CMAKE_ARGUMENTS=-DWITH_FFMPEG=OFF;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON;-DWITH_MEDIACODEC=ON
# The stable NDK r29. Upstream's default in build.gradle, 29.0.13113456, is r29 beta 1.
# The compile check reads this line to find the NDK; whoever builds a release needs this version.
NDK_VERSION=29.0.14206865
# Version scheme: CAPTANTAN.md. versionName = <upstream release>-captantan.<R>,
# versionCode = MAJOR*1000000 + MINOR*10000 + PATCH*100 + R. The release tag is "v" + VERSION_NAME.
VERSION_NAME=3.33.1-captantan.1
VERSION_CODE=3330101
