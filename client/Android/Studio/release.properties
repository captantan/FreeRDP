# captantan fork: build configuration for the fork's releases and its compile check.
# ../build.gradle reads this file as new File('release.properties'), that is relative to the
# directory Gradle is started in, so run ./gradlew from client/Android/Studio.
# CMAKE_ARGUMENTS is upstream's default list from build.gradle with FFmpeg turned off.
ABI_FILTERS=arm64-v8a
SPLIT_ENABLED=false
BUILD_UNIVERSAL=false
CMAKE_ARGUMENTS=-DWITH_FFMPEG=OFF;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON
