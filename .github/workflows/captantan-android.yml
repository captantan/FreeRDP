# SPDX-License-Identifier: Apache-2.0
#
# captantan fork: compile check for the Android client.
#
# It runs the task the builder runs (./gradlew :aFreeRDP:assembleRelease from client/Android/Studio,
# with the builder's Gradle memory settings), asserts on the unsigned release APK, and also builds
# the installable "preview" test build (roadmap decision D5) and keeps it as an artifact for 7 days.
# The preview build type reuses :freeRDPCore's release variant, so the native code is built once.

name: captantan-android

on:
  pull_request:
    branches: [captantan]
  push:
    branches: [captantan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64 (release + preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: client/Android/Studio
    env:
      BUILD_TOOLS: "37.0.0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so the git-version plugin sees an upstream tag as it does on the
          # builder (which clones a tag).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Record the runner
        run: |
          echo "nproc: $(nproc)"
          free -m
          df -h / "$RUNNER_TEMP"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          for d in ndk cmake build-tools platforms; do
            echo "preinstalled $d: $(ls "$ANDROID_HOME/$d" 2>/dev/null | tr '\n' ' ')"
          done

      - name: Find the NDK
        run: |
          # The NDK is the one release.properties names (the stable r29, which the runner image
          # carries); without that line it is the default in build.gradle. Gradle will not download
          # an NDK whose licence is not accepted, so install it here if the image lacks it.
          ndk=$(sed -n 's/^NDK_VERSION=//p' release.properties)
          [ -n "$ndk" ] || ndk=$(sed -n "s/.*NDK_VERSION', '\(.*\)')$/\1/p" build.gradle)
          [ -n "$ndk" ] || { echo "::error::no NDK_VERSION in release.properties or build.gradle"; exit 1; }
          if [ ! -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" | grep -v '^\[=' || true
          fi
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties"
          grep Pkg.Revision "$ANDROID_HOME/ndk/$ndk/source.properties"
          if grep -Eq 'Pkg.Revision.*(beta|rc|canary)' "$ANDROID_HOME/ndk/$ndk/source.properties"; then
            echo "::error::NDK $ndk is not a stable release"; exit 1
          fi
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"

      - name: Prepare as the builder does
        run: |
          # Same as the builder recipe (roadmap 2.3): SDK location and its Gradle memory settings.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m\norg.gradle.workers.max=3\norg.gradle.daemon=false\n' >> gradle.properties
          cat gradle.properties
          # Memory sampler for the rest of the job: used RAM and used swap in MiB every 5 seconds.
          nohup bash -c 'while :; do free -m | awk "/^Mem:/{m=\$3} /^Swap:/{s=\$3} END{print m, s}" >> "$RUNNER_TEMP/mem.log"; sleep 5; done' > /dev/null 2>&1 &

      - name: Build release (the builder's task)
        run: |
          start=$SECONDS
          ./gradlew :aFreeRDP:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/release.log"
          echo "RELEASE_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: Check release.properties was read
        run: |
          log="$RUNNER_TEMP/release.log"
          sed -n '/Project configuration/,/^-\{20,\}$/p' "$log" | tee "$RUNNER_TEMP/config.txt"
          fail() { echo "::error::$1"; exit 1; }
          grep -Eq '^ABI_FILTERS: +\[arm64-v8a\]$' "$RUNNER_TEMP/config.txt" || fail "ABI_FILTERS is not [arm64-v8a]: release.properties was not read"
          grep -Eq '^SPLIT_ENABLED: +false$' "$RUNNER_TEMP/config.txt" || fail "SPLIT_ENABLED is not false"
          grep -Eq '^BUILD_UNIVERSAL: +false$' "$RUNNER_TEMP/config.txt" || fail "BUILD_UNIVERSAL is not false"
          grep -Eq '^CMAKE_ARGUMENTS: .*-DWITH_FFMPEG=OFF' "$RUNNER_TEMP/config.txt" || fail "CMAKE_ARGUMENTS does not turn FFmpeg off"
          grep -Eq '^CMAKE_ARGUMENTS: .*-DWITH_MEDIACODEC=ON' "$RUNNER_TEMP/config.txt" || fail "CMAKE_ARGUMENTS does not turn MediaCodec on"

      - name: Check make job cap
        run: |
          # The superbuild's ExternalProject steps live in the top-level build.ninja. Every make
          # there must have a number after -j (CaptantanMakeJobs.cmake).
          nj=$(find freeRDPCore/.cxx -path '*/arm64-v8a/build.ninja' -not -path '*-prefix*' | head -n 1)
          [ -n "$nj" ] || { echo "::error::top-level build.ninja not found"; exit 1; }
          echo "$nj"
          grep -oE '(^| )-j[0-9]*( |$)' "$nj" | tr -d ' ' | sort | uniq -c
          if grep -qE '(^| )-j( |$)' "$nj"; then echo "::error::a bare make -j is left"; exit 1; fi

      - name: Build preview (test build)
        run: |
          start=$SECONDS
          ./gradlew :aFreeRDP:assemblePreview --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/preview.log"
          echo "PREVIEW_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: Check the APKs
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          APP_ID=$(sed -n 's/^ *applicationId "\(.*\)"$/\1/p' aFreeRDP/build.gradle)
          [ -n "$APP_ID" ] || fail "no applicationId in aFreeRDP/build.gradle"
          # Identity (roadmap 1.2): the fork's package name never changes, the label is "RDP", and
          # the version is the one in release.properties (the scheme is in CAPTANTAN.md).
          [ "$APP_ID" = "dev.captantan.freerdp" ] || fail "applicationId is $APP_ID, not dev.captantan.freerdp"
          VN=$(sed -n 's/^VERSION_NAME=//p' release.properties)
          VC=$(sed -n 's/^VERSION_CODE=//p' release.properties)
          [ -n "$VN" ] && [ -n "$VC" ] || fail "VERSION_NAME or VERSION_CODE is missing from release.properties"
          echo "expected: package $APP_ID, versionName $VN, versionCode $VC, label RDP"
          # Every package-name-dependent identifier in the merged manifest must follow the package.
          check_manifest() {
            apk="$1"; pkg="$2"
            if [ "$(basename "$AAPT")" = aapt ]; then "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
            else "$AAPT" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"; fi
            grep -F "authorities" "$RUNNER_TEMP/manifest.txt" | sed 's/^ *//'
            grep -qF "\"$pkg.clipboard\"" "$RUNNER_TEMP/manifest.txt" || fail "no clipboard provider authority $pkg.clipboard in $apk"
            grep -qF "\"$pkg.fileprovider\"" "$RUNNER_TEMP/manifest.txt" || fail "no file provider authority $pkg.fileprovider in $apk"
            if grep -F "authorities" "$RUNNER_TEMP/manifest.txt" | grep -qE '"com\.freerdp\.[a-z.]*"'; then fail "a provider authority is still under com.freerdp in $apk"; fi
          }

          mapfile -t rel < <(find aFreeRDP/build/outputs/apk/release -name '*.apk')
          [ "${#rel[@]}" -eq 1 ] || fail "expected one release APK, found: ${rel[*]:-none}"
          REL="${rel[0]}"
          mapfile -t pre < <(find aFreeRDP/build/outputs/apk/preview -name '*.apk')
          [ "${#pre[@]}" -eq 1 ] || fail "expected one preview APK, found: ${pre[*]:-none}"
          PRE="${pre[0]}"
          echo "release APK: $REL ($(stat -c %s "$REL") bytes)"
          echo "preview APK: $PRE ($(stat -c %s "$PRE") bytes)"

          echo "== release badging"
          "$AAPT" dump badging "$REL" > "$RUNNER_TEMP/release-badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|native-code|alt-native-code)" "$RUNNER_TEMP/release-badging.txt" | tee "$RUNNER_TEMP/release-badging-short.txt"
          grep -q "^package: name='$APP_ID' " "$RUNNER_TEMP/release-badging.txt" || fail "release package is not $APP_ID"
          grep -qF "package: name='$APP_ID' versionCode='$VC' versionName='$VN'" "$RUNNER_TEMP/release-badging.txt" || fail "release version is not $VN / $VC"
          grep -q "^application-label:'RDP'$" "$RUNNER_TEMP/release-badging.txt" || fail "release label is not 'RDP'"
          check_manifest "$REL" "$APP_ID"
          unzip -l "$REL" | awk '{print $4}' | grep '^lib/' | sort > "$RUNNER_TEMP/release-libs.txt"
          cat "$RUNNER_TEMP/release-libs.txt"
          [ "$(grep -E '^(alt-)?native-code' "$RUNNER_TEMP/release-badging.txt")" = "native-code: 'arm64-v8a'" ] || fail "release native code is not arm64-v8a only"
          case "$REL" in *-unsigned.apk) ;; *) fail "release APK is not named *-unsigned.apk" ;; esac
          if "$BT/apksigner" verify "$REL" > /dev/null 2>&1; then fail "release APK is signed"; fi
          if grep -Eq 'lib(avcodec|avformat|avutil|swscale|swresample)' "$RUNNER_TEMP/release-libs.txt"; then fail "FFmpeg libraries are packaged"; fi
          READELF="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          # The native build must have used the NDK that release.properties names.
          used=$(find freeRDPCore/.cxx -name CMakeCache.txt -path '*arm64-v8a*' -exec grep -hE '^(CMAKE_)?ANDROID_NDK:' {} + | sed 's/^[^=]*=//' | sort -u)
          echo "NDK the native build used: $used"
          [ "$used" = "$ANDROID_HOME/ndk/$NDK_VERSION" ] || fail "native build did not use only NDK $NDK_VERSION"
          while read -r lib; do
            unzip -p "$REL" "$lib" > "$RUNNER_TEMP/lib.so"
            "$READELF" -S "$RUNNER_TEMP/lib.so" > "$RUNNER_TEMP/sections.txt"
            if grep -q '\.debug_info' "$RUNNER_TEMP/sections.txt"; then
              fail "$lib is packaged with debug info (not stripped)"
            fi
          done < "$RUNNER_TEMP/release-libs.txt"
          echo "native libraries in the release APK: $(unzip -l "$REL" 'lib/*' | tail -n 1 | awk '{print $1}') bytes, none with .debug_info"
          # H.264 (roadmap 1.3): libfreerdp3.so has the MediaCodec backend, linked against the
          # platform's libmediandk.so, with OpenH264 still linked and packaged as the software
          # fallback, and both log lines of ours. libfreerdp tries MediaCodec first.
          unzip -p "$REL" lib/arm64-v8a/libfreerdp3.so > "$RUNNER_TEMP/libfreerdp3.so"
          "$READELF" -d "$RUNNER_TEMP/libfreerdp3.so" | grep NEEDED | tee "$RUNNER_TEMP/freerdp3-needed.txt"
          grep -qF '[libmediandk.so]' "$RUNNER_TEMP/freerdp3-needed.txt" || fail "libfreerdp3.so does not link libmediandk.so (MediaCodec is not built)"
          grep -qF '[libopenh264.so]' "$RUNNER_TEMP/freerdp3-needed.txt" || fail "libfreerdp3.so does not link libopenh264.so (no software H.264 fallback)"
          grep -qx 'lib/arm64-v8a/libopenh264.so' "$RUNNER_TEMP/release-libs.txt" || fail "libopenh264.so is not packaged"
          strings "$RUNNER_TEMP/libfreerdp3.so" > "$RUNNER_TEMP/freerdp3-strings.txt"
          for s in 'MediaCodec using %s codec [%s]' 'H.264 %s subsystem: %s' 'AMediaCodec_createCodecByName failed'; do
            grep -qF "$s" "$RUNNER_TEMP/freerdp3-strings.txt" || fail "libfreerdp3.so lacks the string '$s'"
          done
          echo "libfreerdp3.so: MediaCodec backend and OpenH264 fallback present"
          # Per-connection settings (roadmap 1.4): the bookmark editor opens the "RDP options"
          # screen by class name and inflates its layout by resource, so both must be in the APK,
          # and so must the /gfx argument of each graphics mode.
          unzip -p "$REL" 'classes*.dex' > "$RUNNER_TEMP/classes.dex.all"
          for c in ConnectionPrefs GraphicsMode RemoteScale ConnectionOptions 'ConnectionOptions$Draft' ConnectionOptionsFragment; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for s in '/gfx:AVC444,AVC420,RFX,progressive' '/gfx:AVC420,RFX,progressive' '/gfx:RFX,progressive'; do
            grep -qaF "$s" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the graphics argument '$s'"
          done
          "$AAPT" dump resources "$REL" > "$RUNNER_TEMP/resources.txt"
          grep -qF 'xml/captantan_connection_options' "$RUNNER_TEMP/resources.txt" || fail "the APK lacks res/xml/captantan_connection_options"
          echo "per-connection settings: classes, graphics arguments and options screen present"
          # Launcher icon (roadmap 1.7): the app module's adaptive icon overrides the library's by
          # name. Only ours has a drawable (not a colour) called ic_launcher_background.
          grep -qF 'drawable/ic_launcher_background' "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the app's launcher icon (drawable/ic_launcher_background)"
          grep -qF 'mipmap/ic_launcher' "$RUNNER_TEMP/resources.txt" || fail "the APK lacks mipmap/ic_launcher"
          echo "launcher icon: the app module's adaptive icon is present"
          # Physical keyboard (roadmap 5.1): the natives of captantan/PhysicalKeyboard are found by
          # name at run time, so a missing or misnamed one compiles and then fails at the first key.
          grep -qaF 'Lcom/freerdp/freerdpcore/captantan/PhysicalKeyboard;' "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/PhysicalKeyboard"
          unzip -p "$REL" lib/arm64-v8a/libfreerdp-android.so > "$RUNNER_TEMP/libfreerdp-android.so"
          "$READELF" --dyn-syms -W "$RUNNER_TEMP/libfreerdp-android.so" > "$RUNNER_TEMP/android-dynsyms.txt"
          for n in nativeScanCode nativeSendKey nativeSendPause nativeSendLocks; do
            grep -qaF "$n" "$RUNNER_TEMP/classes.dex.all" || fail "captantan/PhysicalKeyboard lacks the native method $n"
            grep -Eq " FUNC +GLOBAL +DEFAULT +[0-9]+ Java_com_freerdp_freerdpcore_captantan_PhysicalKeyboard_$n\$" "$RUNNER_TEMP/android-dynsyms.txt" || fail "libfreerdp-android.so does not export the native $n of captantan/PhysicalKeyboard"
          done
          echo "physical keyboard: class and its four natives present"
          # Display control (roadmap 3.1): the natives of captantan/DisplayControl are found by name
          # too, and so is the method the native side reports to: a missing or misnamed one compiles
          # and then fails, or stays silent, at the first resize.
          grep -qaF 'Lcom/freerdp/freerdpcore/captantan/DisplayControl;' "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/DisplayControl"
          for n in nativeInit nativeRequest; do
            grep -qaF "$n" "$RUNNER_TEMP/classes.dex.all" || fail "captantan/DisplayControl lacks the native method $n"
            grep -Eq " FUNC +GLOBAL +DEFAULT +[0-9]+ Java_com_freerdp_freerdpcore_captantan_DisplayControl_$n\$" "$RUNNER_TEMP/android-dynsyms.txt" || fail "libfreerdp-android.so does not export the native $n of captantan/DisplayControl"
          done
          grep -qaF 'onNativeEvent' "$RUNNER_TEMP/classes.dex.all" || fail "captantan/DisplayControl lacks onNativeEvent, which the native side calls by name"
          unzip -p "$REL" lib/arm64-v8a/libfreerdp-android.so | grep -qaF '(JIIIIIIII)V' || fail "libfreerdp-android.so does not look up DisplayControl.onNativeEvent with the expected signature"
          echo "display control: class, its two natives and the event callback present"
          # Material 3 theme (roadmap 7.2a): every activity uses upstream's Theme.Main, which the
          # app module redefines (aFreeRDP/src/main/res/values*/captantan_theme.xml) over
          # freeRDPCore's theme.xml. In the APK every configuration of Theme.Main must have the fork's
          # Theme.Captantan as parent (aapt2 folds our identical night copy into the default one; an
          # upstream Theme.Main left in any configuration would show up here with another parent);
          # and the fork's dialogs use Material's builder.
          if [ "$(basename "$AAPT")" = aapt ]; then
            "$AAPT" dump --values resources "$REL" > "$RUNNER_TEMP/resource-values.txt"
            cap=$(grep -m 1 -oE 'spec resource 0x[0-9a-f]+ [^ ]*:style/Theme\.Captantan:' "$RUNNER_TEMP/resource-values.txt" | awk '{print $3}')
            [ -n "$cap" ] || fail "the APK has no style Theme.Captantan"
            grep -A 1 -E '^ +resource 0x[0-9a-f]+ [^ ]*:style/Theme\.Main: <bag>' "$RUNNER_TEMP/resource-values.txt" | tee "$RUNNER_TEMP/theme-main.txt"
            n=$(grep -cE ':style/Theme\.Main: <bag>' "$RUNNER_TEMP/theme-main.txt" || true)
            [ "$n" -ge 1 ] || fail "the APK has no style Theme.Main"
            others=$(grep -oE 'Parent=0x[0-9a-f]+' "$RUNNER_TEMP/theme-main.txt" | sed 's/Parent=//' | grep -vx "$cap" || true)
            [ "$(grep -cE 'Parent=' "$RUNNER_TEMP/theme-main.txt")" -eq "$n" ] && [ -z "$others" ] || fail "Theme.Main's parent is not Theme.Captantan ($cap) in every configuration"
            echo "Theme.Main resolves to Theme.Captantan ($cap) in all $n configuration(s)"
          else
            echo "::warning::aapt (v1) not found; the Theme.Main check needs its --values dump and was skipped"
          fi
          grep -qaF 'Lcom/google/android/material/dialog/MaterialAlertDialogBuilder;' "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks Material's MaterialAlertDialogBuilder"
          # Session host (roadmap 2.1): sessions belong to the process, and a session launch reuses
          # the one session window (singleTop) instead of making a task per launch. A merge that
          # brings documentLaunchMode back would silently undo that.
          for c in SessionHost SessionRegistry SessionWindow; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          if [ "$(basename "$AAPT")" = aapt ]; then "$AAPT" dump xmltree "$REL" AndroidManifest.xml > "$RUNNER_TEMP/manifest-rel.txt"
          else "$AAPT" dump xmltree --file AndroidManifest.xml "$REL" > "$RUNNER_TEMP/manifest-rel.txt"; fi
          if grep -qF "documentLaunchMode" "$RUNNER_TEMP/manifest-rel.txt"; then fail "an activity has documentLaunchMode again: every session launch would make a new task"; fi
          grep -F "launchMode" "$RUNNER_TEMP/manifest-rel.txt" | sed 's/^ *//'
          grep -qF "launchMode" "$RUNNER_TEMP/manifest-rel.txt" || fail "no activity has a launchMode: the session activity must be singleTop"
          echo "session host: classes present, session activity is singleTop without documentLaunchMode"
          # Session switcher (roadmap 2.2): the switcher, the launcher that keeps the window rules,
          # the list's marking, the toolbar button they hang from and the sheet's layouts.
          for c in SessionSwitcher SessionLauncher HomeSessions; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for r in id/captantan_floating_toolbar_sessions layout/captantan_session_switcher layout/captantan_session_switcher_item; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          echo "session switcher: classes, toolbar button and layouts present"
          # Sessions in the background (roadmap 2.3): the keep-alive service in the merged manifest,
          # not exported, with the types specialUse (0x40000000), microphone (0x80) and camera
          # (0x40) and its specialUse subtype, the permissions those types need (Android 14 and
          # later refuse startForeground without them), and the activity a notification tap opens.
          for c in SessionKeeper SessionKeepAliveService SessionNotifications SessionOpenActivity; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          awk '{
            if (inblk) {
              if ($0 ~ /E: / && index($0, "E:") <= ind) { inblk = 0; if (blk ~ /SessionKeepAliveService"/) printf "%s", blk }
              else { blk = blk $0 "\n"; next }
            }
            if ($0 ~ /E: service /) { ind = index($0, "E:"); inblk = 1; blk = $0 "\n" }
          }
          END { if (inblk && blk ~ /SessionKeepAliveService"/) printf "%s", blk }' "$RUNNER_TEMP/manifest-rel.txt" > "$RUNNER_TEMP/keepalive-service.txt"
          sed 's/^ *//' "$RUNNER_TEMP/keepalive-service.txt"
          grep -qF 'captantan.SessionKeepAliveService"' "$RUNNER_TEMP/keepalive-service.txt" || fail "the merged manifest has no service captantan.SessionKeepAliveService"
          grep -qE 'exported\(0x01010010\)=(\(type 0x12\)0x0|false)$' "$RUNNER_TEMP/keepalive-service.txt" || fail "the keep-alive service is exported"
          fgs=$(sed -nE 's/.*foregroundServiceType\(0x01010599\)=(\(type 0x11\))?(0x[0-9a-fA-F]+|[0-9]+).*/\2/p' "$RUNNER_TEMP/keepalive-service.txt")
          [ -n "$fgs" ] || fail "the keep-alive service has no foregroundServiceType"
          [ $(( fgs & 0x400000c0 )) -eq $(( 0x400000c0 )) ] || fail "the keep-alive service's types are $fgs, not specialUse|microphone|camera"
          grep -qF 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$RUNNER_TEMP/keepalive-service.txt" || fail "the keep-alive service has no specialUse subtype property"
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE FOREGROUND_SERVICE_MICROPHONE FOREGROUND_SERVICE_CAMERA POST_NOTIFICATIONS RECORD_AUDIO CAMERA; do
            grep -qF "\"android.permission.$p\"" "$RUNNER_TEMP/manifest-rel.txt" || fail "the merged manifest lacks the permission $p"
          done
          grep -qF 'captantan.SessionOpenActivity"' "$RUNNER_TEMP/manifest-rel.txt" || fail "the merged manifest has no activity captantan.SessionOpenActivity"
          echo "background sessions: keep-alive service with types $fgs (specialUse|microphone|camera), its permissions and the tap activity present"
          # Session bar (roadmap 4.1): the bar, its touch filter and its settings, the layer in the
          # session layout it is put into, its own layouts, and the per-connection keys the "RDP
          # options" screen edits by name.
          for c in SessionBar SessionBarGestures SessionBarSettings 'SessionBarSettings$Mode' 'SessionBarSettings$Edge'; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for r in id/captantan_session_bar_container layout/captantan_session_bar layout/captantan_session_bar_settings id/captantan_bar_buttons drawable/captantan_ic_fullscreen drawable/captantan_ic_zoom_reset; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in bar_mode bar_edge bar_opacity captantan.bar; do
            grep -qaF "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of the session bar"
          done
          echo "session bar: classes, layer, layouts, icons and per-connection keys present"
          # Session bar leftovers (roadmap 4.2): the remote scale choice (since 5.2 in the bar's
          # settings sheet, no longer a button with an icon), the
          # "keep in full screen" switch and its per-connection key (a boolean field), and the
          # resize controller's "ask again".
          for c in RemoteScaleSwitch 'ConnectionPrefs$BoolField'; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for r in id/captantan_bar_settings_scale id/captantan_bar_settings_fullscreen string/captantan_bar_fullscreen_keep string/captantan_bar_scale_auto array/captantan_remote_scale_values; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in bar_in_fullscreen askAgain 'ask again' 'remote scale: ' 'in full screen '; do
            grep -qaF "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of the session bar (4.2)"
          done
          echo "session bar (4.2): scale menu, its button, icon and strings, keep-in-full-screen switch and key present"
          # Trackpad mode (roadmap 4.3): the gestures, the drawn pointer, the mode switch, the
          # modes, direct touch's one-finger drag scroll, the view tag SessionView finds it by, the icons, and the per-connection keys
          # and stored names the "RDP options" screen edits by name (permanent once released).
          for c in TrackpadInput TrackpadPointer TouchModeSwitch TouchMode 'TouchMode$Scroll' 'TouchMode$Drag' DirectTouchDrag; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for r in id/captantan_tag_trackpad drawable/captantan_ic_trackpad drawable/captantan_ic_touch_direct drawable/ic_touch_pointer array/captantan_touch_mode_values array/captantan_touch_scroll_values array/captantan_touch_drag_values; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in touch_mode pointer_speed touch_scroll touch_drag touch_pointer trackpad natural traditional captantan.trackpad; do
            grep -qaF "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of trackpad mode"
          done
          echo "trackpad mode: classes, view tag, icons, per-connection keys and stored names present"
          # Pen input: the input channel ([MS-RDPEI], "rdpei") is built into the client library and
          # asked for with /multitouch; the natives of captantan/PenInput are found by name at run
          # time, so a missing or misnamed one compiles and then fails at the first pen event; and
          # the per-connection key and stored names the "RDP options" screen edits by name
          # (permanent once released).
          unzip -p "$REL" lib/arm64-v8a/libfreerdp-client3.so > "$RUNNER_TEMP/libfreerdp-client3.so"
          strings "$RUNNER_TEMP/libfreerdp-client3.so" > "$RUNNER_TEMP/freerdp-client3-strings.txt"
          for s in 'Microsoft::Windows::RDS::Input' 'Unknown [MS-RDPEI] protocolVersion'; do
            grep -qF "$s" "$RUNNER_TEMP/freerdp-client3-strings.txt" || fail "libfreerdp-client3.so lacks the string '$s' (the rdpei channel is not built in)"
          done
          for c in PenInput 'PenInput$Mode' PenProbe; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for n in nativeState nativeDescribe nativePen; do
            grep -qaF "$n" "$RUNNER_TEMP/classes.dex.all" || fail "captantan/PenInput lacks the native method $n"
            grep -Eq " FUNC +GLOBAL +DEFAULT +[0-9]+ Java_com_freerdp_freerdpcore_captantan_PenInput_$n\$" "$RUNNER_TEMP/android-dynsyms.txt" || fail "libfreerdp-android.so does not export the native $n of captantan/PenInput"
          done
          for k in /multitouch captantan.pen pen_mode; do
            grep -qaF -- "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of pen input"
          done
          grep -qF 'array/captantan_pen_mode_values' "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource array/captantan_pen_mode_values"
          echo "pen input: rdpei channel built in, classes, natives, the /multitouch argument, the per-connection key and its stored names present"
          # System-key capture (roadmap 5.2): the controller, the permission in the merged manifest
          # (without it Android ignores the request silently), the window call, the bar's capture
          # button, its icons and the settings switch, the per-connection key the "RDP options"
          # screen edits by name (permanent once released), and the log strings.
          grep -qaF "Lcom/freerdp/freerdpcore/captantan/KeyCaptureController;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/KeyCaptureController"
          grep -qF '"android.permission.CAPTURE_KEYBOARD"' "$RUNNER_TEMP/manifest-rel.txt" || fail "the merged manifest lacks the permission CAPTURE_KEYBOARD"
          for r in id/captantan_bar_capture id/captantan_bar_settings_capture drawable/captantan_ic_key_capture drawable/captantan_ic_key_capture_off string/captantan_key_capture layout/captantan_scale_chip id/captantan_bar_zoom_reset; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in setKeyboardCaptureEnabled hasKeyboardCapture key_capture 'key capture ' ' mechanism ' android.permission.CAPTURE_KEYBOARD; do
            grep -qaF -- "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of system-key capture"
          done
          echo "system-key capture: controller, permission, window call, bar button, icons, switch, per-connection key and log strings present"
          # Window behaviour (roadmap 6.1): the remembered bounds and the state key they are stored
          # under (permanent once released), the session window's <layout> (default and minimum
          # size of a desktop window) in the merged manifest, the minimum size resources, the task
          # label call, the connect that waits for a desktop window's caption bar, a desktop
          # window's own full screen (captantan/FullScreen), and the log
          # strings that make each part checkable on a device.
          for c in WindowBounds FullScreen; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          awk '/E: activity/{a=0} /SessionActivity"/{a=1} a&&/E: layout/{l=1} l&&/minWidth/{w=1} l&&/minHeight/{h=1} l&&/defaultWidth/{d=1} END{exit !(w&&h&&d)}' "$RUNNER_TEMP/manifest-rel.txt" || fail "the merged manifest has no <layout> with minWidth, minHeight and defaultWidth for SessionActivity"
          for r in dimen/captantan_window_min_width dimen/captantan_window_min_height; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in window_bounds setLaunchBounds setTaskDescription android:activity.launchDisplayId 'window title: ' 'window bounds stored: ' 'window bounds used for ' 'window bounds ignored for ' 'waits for the caption bar' 'connect size ' bringToFrontIfShown 'this desktop window only'; do
            grep -qaF -- "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of window behaviour (6.1)"
          done
          echo "window behaviour: bounds class and key, manifest layout, minimum size, title, caption wait and log strings present"
          # Session tabs (roadmap 6.1b): the tab model and the strip, the transparent caption bar
          # and the system-gesture exclusion the tabs need on the tablet, their icons and strings,
          # the app-wide state keys (permanent once released: the session window's bounds, the
          # moved default of "Open new connections"), the new default in the settings screen, the
          # connect that finishes a waiting one first, and the log strings.
          for c in SessionTabs SessionTabStrip; do
            grep -qaF "Lcom/freerdp/freerdpcore/captantan/$c;" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the class captantan/$c"
          done
          for r in drawable/captantan_ic_close drawable/captantan_ic_add drawable/captantan_ic_attention string/captantan_tab_new string/captantan_tab_close string/captantan_back_other_tabs; do
            grep -qF "$r" "$RUNNER_TEMP/resources.txt" || fail "the APK lacks the resource $r"
          done
          for k in setSystemGestureExclusionRects setSystemBarsAppearance getBoundingRects captantan_tab_window_bounds captantan_new_connection_default_moved 'tab strip ' 'tabs: ' 'tab: ' 'taken from the system' 'shows its tab ' 'another connect started in it' 'open new connections: '; do
            grep -qaF -- "$k" "$RUNNER_TEMP/classes.dex.all" || fail "the APK lacks the string '$k' of session tabs (6.1b)"
          done
          if [ "$(basename "$AAPT")" = aapt ]; then "$AAPT" dump xmltree "$REL" res/xml/settings_app_ui.xml > "$RUNNER_TEMP/settings-ui.txt"
          else "$AAPT" dump xmltree --file res/xml/settings_app_ui.xml "$REL" > "$RUNNER_TEMP/settings-ui.txt"; fi
          grep -A1 -F 'defaultValue' "$RUNNER_TEMP/settings-ui.txt" | grep -qF '"this_window"' || fail "the default of Open new connections is not this_window"
          echo "session tabs: model, strip, caption calls, icons, strings, state keys, the new default and log strings present"

          echo "== preview badging"
          "$AAPT" dump badging "$PRE" > "$RUNNER_TEMP/preview-badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|native-code|alt-native-code)" "$RUNNER_TEMP/preview-badging.txt" | tee "$RUNNER_TEMP/preview-badging-short.txt"
          grep -q "^package: name='$APP_ID.debug' " "$RUNNER_TEMP/preview-badging.txt" || fail "preview package is not $APP_ID.debug"
          grep -qF "package: name='$APP_ID.debug' versionCode='$VC' versionName='$VN'" "$RUNNER_TEMP/preview-badging.txt" || fail "preview version is not $VN / $VC"
          grep -q "^application-label:'RDP debug'$" "$RUNNER_TEMP/preview-badging.txt" || fail "preview label is not 'RDP debug'"
          check_manifest "$PRE" "$APP_ID.debug"
          [ "$(grep -E '^(alt-)?native-code' "$RUNNER_TEMP/preview-badging.txt")" = "native-code: 'arm64-v8a'" ] || fail "preview native code is not arm64-v8a only"
          "$BT/apksigner" verify --print-certs -v "$PRE" | tee "$RUNNER_TEMP/preview-signature.txt"
          want=$(openssl pkcs12 -in aFreeRDP/preview-key/preview.p12 -passin pass:android -nokeys \
                 | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
          grep -q "certificate SHA-256 digest: $want$" "$RUNNER_TEMP/preview-signature.txt" || fail "preview is not signed with preview-key/preview.p12"

          echo "== native libraries, release vs preview"
          unzip -l "$PRE" | awk '{print $4}' | grep '^lib/' | sort > "$RUNNER_TEMP/preview-libs.txt"
          diff "$RUNNER_TEMP/release-libs.txt" "$RUNNER_TEMP/preview-libs.txt" || fail "release and preview package different native libraries"
          while read -r lib; do
            a=$(unzip -p "$REL" "$lib" | sha256sum | cut -d' ' -f1)
            b=$(unzip -p "$PRE" "$lib" | sha256sum | cut -d' ' -f1)
            [ "$a" = "$b" ] || fail "$lib differs between release and preview"
            echo "$a  $lib"
          done < "$RUNNER_TEMP/release-libs.txt"

      - name: Upload the preview APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdp-preview-apk
          path: client/Android/Studio/aFreeRDP/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## captantan-android"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| assembleRelease | ${RELEASE_SECONDS:-n/a} s |"
            echo "| assemblePreview (after release) | ${PREVIEW_SECONDS:-n/a} s |"
            if [ -s "$RUNNER_TEMP/mem.log" ]; then
              echo "| peak RAM used | $(awk '$1>m{m=$1} END{print m}' "$RUNNER_TEMP/mem.log") MiB of $(free -m | awk '/^Mem:/{print $2}') MiB |"
              echo "| peak swap used | $(awk '$2>m{m=$2} END{print m+0}' "$RUNNER_TEMP/mem.log") MiB |"
            fi
            echo "| nproc | $(nproc) |"
            echo "| JDK | $(java -version 2>&1 | head -n 1) |"
            echo "| NDK installed | $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ') |"
            echo "| CMake installed | $(ls "$ANDROID_HOME/cmake" 2>/dev/null | tr '\n' ' ') |"
            echo
            echo "### Toolchain the native build used"
            echo '```'
            find freeRDPCore/.cxx -name CMakeCache.txt -path '*arm64-v8a*' -exec grep -hE '^(CMAKE_COMMAND|CMAKE_ANDROID_NDK|ANDROID_NDK|CMAKE_C_COMPILER):' {} + 2>/dev/null | sort -u || true
            echo "-- CMAKE_BUILD_TYPE per CMake build tree:"
            find freeRDPCore/.cxx -name CMakeCache.txt -path '*arm64-v8a*' | while read -r c; do
              echo "$(grep -h '^CMAKE_BUILD_TYPE:' "$c" | cut -d= -f2) ${c#freeRDPCore/.cxx/}"
            done || true
            echo "-- compiler flags of one libfreerdp3 object:"
            f=$(find freeRDPCore/.cxx -path '*freerdp-build*' -name build.ninja 2>/dev/null | head -n 1 || true)
            [ -n "$f" ] && grep -m 1 -A 6 '^build libfreerdp/.*\.c\.o: C_COMPILER' "$f" | grep -m 1 -E '^ +FLAGS =' || true
            for c in "$ANDROID_HOME"/cmake/*/bin/cmake; do [ -x "$c" ] && "$c" --version | head -n 1; done
            for n in "$ANDROID_HOME"/ndk/*/source.properties; do [ -f "$n" ] && grep Pkg.Revision "$n"; done
            grep -rh "captantan fork: make job count" freeRDPCore/.cxx freeRDPCore/build/intermediates/cxx 2>/dev/null | sort -u || true
            echo '```'
            echo
            echo "### Project configuration"
            echo '```'
            cat "$RUNNER_TEMP/config.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "### APKs"
            echo '```'
            cat "$RUNNER_TEMP/release-badging-short.txt" "$RUNNER_TEMP/preview-badging-short.txt" 2>/dev/null || true
            echo '```'
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
